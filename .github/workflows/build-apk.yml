name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore approved app icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d assets/icon.b64 > app/src/main/res/drawable/app_icon.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HllyoudGuess.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HllyoudGuess-APK
          path: HllyoudGuess.apk
          retention-days: 30

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest HllyoudGuess.apk --clobber
          else
            gh release create android-latest HllyoudGuess.apk --title "Hllyoud guess Android" --notes "Latest installable Android APK for Hllyoud guess."
          fi
