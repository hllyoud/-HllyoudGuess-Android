name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d assets/icon.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check live game endpoint
        run: |
          curl -fsSL --max-time 25 "https://tmphtxyrpwzwfivsvijz.supabase.co/functions/v1/hllyoud-app" -o /tmp/hllyoud-game.html
          test "$(wc -c < /tmp/hllyoud-game.html)" -gt 1000

      - name: Build installable APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HllyoudGuess.apk

      - name: Verify APK
        run: |
          test -s HllyoudGuess.apk
          unzip -t HllyoudGuess.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose HllyoudGuess.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging HllyoudGuess.apk | tee /tmp/badging.txt
          grep -F "package: name='com.hllyoud.guess'" /tmp/badging.txt
          grep -F "versionName='1.0.2'" /tmp/badging.txt
          grep -F "application-label:'Hllyoud guess'" /tmp/badging.txt
          grep -F "application-icon-" /tmp/badging.txt
          grep -F "launchable-activity: name='com.hllyoud.guess.MainActivity'" /tmp/badging.txt

      - name: Android emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r HllyoudGuess.apk
            adb logcat -c
            adb shell am start -W -n com.hllyoud.guess/.MainActivity
            sleep 12
            adb shell pidof com.hllyoud.guess
            if adb logcat -d | grep -A 8 -B 3 "FATAL EXCEPTION" | grep -q "com.hllyoud.guess"; then
              echo "Fatal exception detected for Hllyoud guess"
              exit 1
            fi

      - name: APK size
        run: |
          stat --printf='APK_BYTES=%s\n' HllyoudGuess.apk
          ls -lh HllyoudGuess.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HllyoudGuess-APK
          path: HllyoudGuess.apk
          retention-days: 30

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest HllyoudGuess.apk --clobber
          else
            gh release create android-latest HllyoudGuess.apk --title "Hllyoud guess Android" --notes "Latest installable Android APK for Hllyoud guess."
          fi
