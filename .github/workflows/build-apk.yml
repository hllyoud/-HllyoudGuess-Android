name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check live game endpoint
        run: |
          curl -fsSL --max-time 25 "https://tmphtxyrpwzwfivsvijz.supabase.co/functions/v1/hllyoud-app" -o /tmp/hllyoud-game.html
          test "$(wc -c < /tmp/hllyoud-game.html)" -gt 1000

      - name: Create temporary E2E account
        run: |
          TEST_USER="androidci${GITHUB_RUN_NUMBER}"
          TEST_PASS="Ci${GITHUB_RUN_ID}x9"
          HTTP_CODE=$(curl -sS -o /tmp/signup.json -w "%{http_code}" -X POST "https://tmphtxyrpwzwfivsvijz.supabase.co/functions/v1/signup-username" -H "Content-Type: application/json" --data "{\"username\":\"${TEST_USER}\",\"password\":\"${TEST_PASS}\",\"preferred_language\":\"ar\"}")
          test "$HTTP_CODE" = "200"
          python3 -c "import json; d=json.load(open('/tmp/signup.json')); assert d.get('ok') is True and d.get('user',{}).get('username')"
          echo "ANDROID_TEST_USER=${TEST_USER}" >> "$GITHUB_ENV"
          echo "ANDROID_TEST_PASS=${TEST_PASS}" >> "$GITHUB_ENV"

      - name: Build installable APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HllyoudGuess.apk

      - name: Verify APK
        run: |
          test -s HllyoudGuess.apk
          unzip -t HllyoudGuess.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose HllyoudGuess.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging HllyoudGuess.apk | tee /tmp/badging.txt
          grep -F "package: name='com.hllyoud.guess'" /tmp/badging.txt
          grep -F "versionName='1.0.3'" /tmp/badging.txt
          grep -F "application-label:'Hllyoud guess'" /tmp/badging.txt
          grep -F "launchable-activity: name='com.hllyoud.guess.MainActivity'" /tmp/badging.txt
          grep -F "application-icon-" /tmp/badging.txt || grep -F "icon='res/drawable/ic_launcher.xml'" /tmp/badging.txt
          unzip -p HllyoudGuess.apk classes.dex > /tmp/classes.dex
          "$ANDROID_HOME/build-tools/35.0.0/dexdump" /tmp/classes.dex | grep -F "Lcom/hllyoud/guess/MainActivity;"

      - name: APK size
        run: |
          stat --printf='APK_BYTES=%s\n' HllyoudGuess.apk | tee apk-size.txt
          ls -lh HllyoudGuess.apk | tee -a apk-size.txt

      - name: Upload APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: HllyoudGuess-APK-candidate
          path: |
            HllyoudGuess.apk
            apk-size.txt
          retention-days: 30

      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android live WebView E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            adb install -r HllyoudGuess.apk
            adb shell pm list packages | grep -F "package:com.hllyoud.guess"
            adb logcat -c
            adb shell am force-stop com.hllyoud.guess
            adb shell am start -W -n com.hllyoud.guess/.MainActivity --ez hllyoud_e2e true --es e2e_username "$ANDROID_TEST_USER" --es e2e_password "$ANDROID_TEST_PASS" | tee android-start.txt
            sleep 27
            adb exec-out screencap -p > android-e2e.png
            adb logcat -d > android-logcat.txt
            grep -F "HllyoudE2E" android-logcat.txt | tee e2e-log.txt
            grep -F "E2E_START" e2e-log.txt
            grep -F "LOGIN=\"login_clicked\"" e2e-log.txt
            grep -F "AFTER_LOGIN=" e2e-log.txt
            grep -F "COMPUTER=" e2e-log.txt
            grep -F "AFTER_COMPUTER_CLICK=" e2e-log.txt
            grep -F "SECRET=" e2e-log.txt
            grep -F "AFTER_SECRET=" e2e-log.txt
            adb shell dumpsys activity activities | grep -F "mResumedActivity" | tee resumed.txt
            grep -F "com.hllyoud.guess" resumed.txt
            adb shell ps -A | grep -F "com.hllyoud.guess"
            python3 -c "p=open('android-logcat.txt',errors='ignore').read(); blocks=p.split('FATAL EXCEPTION'); assert not any('com.hllyoud.guess' in b[:5000] for b in blocks[1:]), 'Fatal exception detected for Hllyoud guess'"
            echo ANDROID_LIVE_E2E_CAPTURED

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HllyoudGuess-Android-runtime
          path: |
            android-e2e.png
            e2e-log.txt
            resumed.txt
            android-start.txt
            android-logcat.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HllyoudGuess-APK
          path: HllyoudGuess.apk
          retention-days: 30

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest HllyoudGuess.apk --clobber
          else
            gh release create android-latest HllyoudGuess.apk --title "Hllyoud guess Android" --notes "Latest validated Android APK for Hllyoud guess."
          fi
